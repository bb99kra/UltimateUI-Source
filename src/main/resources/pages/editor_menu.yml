        height: 64
      text: 
      children:
        - type: hitbox
          id: editormenu_navbar_close
          layer: 9205.0
          opacity: 0
          color: ff0000
          position:
            x: 0
            y: -20
          size:
            width: 72
            height: 28
          unicode: 
  editor_animation:
    delay: 3
    keyframes:
      position:
        '15':
          y: 12
          interpolation: smooth-out
