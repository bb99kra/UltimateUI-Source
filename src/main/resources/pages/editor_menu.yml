name: editor
screen:
  width: 1920
  height: 1080
  offsetX: 0
  offsetY: 0
  preview:
    defaultZoom: 0.8
  hitboxOffsetX: -2
  hitboxOffsetY: -17
  cursorSize: 10
  cursorSpeed: 1.0
  cursorUnicode: 
  cursorLayer: 9700
blocks:
- type: block
  id: background
  layer: 0.0
  opacity: 255
  color: 080808
  position:
    x: -1920/2
    y: -1080/2
  size:
    width: 1920*2
    height: 1080*2
  unicode: 
- type: block
  id: navbar
  layer: 9200.0
  opacity: 255
  color: 0f0f0f
  position:
    x: -1920/2
    y: 0
  size:
    width: 1920*2
    height: 53
  outline:
    size: 1
    color: 141414
  unicode: 
- type: block
  layer: 9200.0
  opacity: 0
  color: ff0000
  position:
    x: 0
    y: -30
  size:
    width: 500
    height: 52-20
  unicode: 
  children:
    - type: block
      id: navbar_logo
      opacity: 0
      position:
        x: 12
        y: -2
      size:
        width: 0
        height: 0
      unicode: 
      children:
        - type: text
          layer: 9201.0
          opacity: 255
          color: ffffff
          align: left
          position:
            x: 0
            y: 23
          size:
            width: 64
            height: 64
