params:
  id: ""
  text_1: "?"
  text_2: "?"
  footer: false
  active: false
  yoffset: 0
blocks:
  - type: hitbox
    id: dropdown_${id}_hitbox
    layer: 9405.0
    opacity: 0
    color: ff0000
    position:
      x: 0
      y: 16
    size:
      width: 210
      height: 32
    unicode: 
  - case: "{active}"
    true:
      - type: block
        id: dropdown_${id}
        layer: 9400.0
        opacity: 255
        color: 141414
        position:
          x: 0
          y: 0
        size:
          width: 210
          height: 32
        unicode: 
        children:
          - type: block
            layer: 9400.0
            opacity: 255
            color: 141414
            position:
              x: 0
              y: 0
            size:
              width: 0
              height: 0
            unicode: 
            children:
              - type: text
                id: dropdown_${id}_text
                layer: 9401.0
                opacity: 255
                color: ffffff
                align: left
                position:
                  x: 10
                  y: 12+{yoffset}
                size:
                  width: 64
                  height: 64
                text: ${text_2}
    false:
      - type: block
        id: dropdown_${id}
        layer: 9400.0
        opacity: 255
        color: 0f0f0f
        position:
          x: 0
          y: 0
        size:
          width: 210
          height: 32
        unicode: 
        children:
          - type: text
            id: dropdown_${id}_text
            layer: 9401.0
            opacity: 255
            color: ffffff
            align: left
            position:
              x: 10
              y: 12+{yoffset}
            size:
              width: 64
              height: 64
            text: ${text_1}
  - case: "{footer}"
    true:
      - type: block
        layer: 9500.0
        opacity: 25c5
        color: 191919
        position:
          x: 0
          y: 31
        size:
          width: 210
          height: 2
        unicode: 
